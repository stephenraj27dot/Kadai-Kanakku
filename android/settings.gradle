plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
include ':app'

def capacitorSettings = file('capacitor.settings.gradle')
if (capacitorSettings.exists()) {
    apply from: 'capacitor.settings.gradle'
}

def cordovaPlugins = file('capacitor-cordova-android-plugins')
if (cordovaPlugins.exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = cordovaPlugins
}
